<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />

  <title>全景自测 — LeakDetector</title>
  <link rel="stylesheet" href="../assets/lesson.css" />
</head>
<body>
<main>
  <header class="site">
    <div class="kicker">Lesson 0002</div>
    <h1>全景自测</h1>
    <p class="lede">先读 <a href="../reference/architecture.html">架构</a>，再闭卷做题。</p>
  </header>

  <h2>带走三句</h2>
  <ol>
    <li>分配建卡、释放销卡、结束扫表 → <strong>确定泄漏</strong>。</li>
    <li>JSONL 是 C++ 与 C# 之间的交接契约。</li>
    <li>C# 分析器自己配对；summary 是旁证，不是裁判。</li>
  </ol>

  <div class="quiz" data-ok="对：剩下的就是泄漏。" data-bad="想想档案卡什么时候被撕掉。">
    <strong>1.</strong>程序结束时，分配表里还在的条目代表？
    <button type="button" data-correct="false">已经正确释放的内存块记录</button>
    <button type="button" data-correct="true">分配过但尚未释放的内存块</button>
    <button type="button" data-correct="false">编译器优化掉的临时对象列表</button>
    <div class="feedback"></div>
  </div>

  <div class="quiz" data-ok="对：中间契约是文件。" data-bad="再看两段式流水线。">
    <strong>2.</strong>C++ 侧和 C# 侧默认靠什么解耦？
    <button type="button" data-correct="true">JSONL 日志文件作为中间契约</button>
    <button type="button" data-correct="false">共享同一块进程内内存映射</button>
    <button type="button" data-correct="false">必须编译成同一个混合语言程序集</button>
    <div class="feedback"></div>
  </div>

  <div class="quiz" data-ok="对：Parsers 只翻译。" data-bad="回顾模块边界。">
    <strong>3.</strong>谁不应该负责「有没有泄漏」的最终判断？
    <button type="button" data-correct="false">Core 里的泄漏分析器</button>
    <button type="button" data-correct="true">Parsers 里的 JSONL 翻译器</button>
    <button type="button" data-correct="false">C++ 结束时的扫表报告</button>
    <div class="feedback"></div>
  </div>

  <nav class="links">

    <a href="../reference/architecture.html">架构</a>
  </nav>

  <footer>卡住就问老师，并把当前理解用一句话说出来。</footer>
</main>

</body>
